# ARCHITECTURE: CI is the repository quality gate.
# It runs deterministic type/lint/smoke checks before code is treated as releasable.
# CI should verify business contracts, not contain application logic.
name: CI

on:
  push:
    branches: [main, feature/studio-v4, feature/calculators-lab]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: CMS smoke tests
        run: npm run test:cms

      - name: Calculator Lab smoke tests
        run: npm run test:calculator-lab

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
