name: Studio branch build check

on:
  push:
    branches: [feature/studio-v4]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
