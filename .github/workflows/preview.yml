name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Create preview artifact
        run: |
          mkdir -p preview
          cp -r .next preview/next-build
          cp package.json preview/
          cp next.config.ts preview/ 2>/dev/null || true
          tar -czf geodesy-preview.tar.gz preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: malaya-geodesia-preview
          path: geodesy-preview.tar.gz
          retention-days: 7

      - name: Preview summary
        run: |
          {
            echo "## Preview build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Build: npm run build"
            echo "- Artifact: malaya-geodesia-preview"
          } >> "$GITHUB_STEP_SUMMARY"
