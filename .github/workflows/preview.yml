# ARCHITECTURE: Preview deployment workflow.
# Connects source changes to a disposable preview, keeping deployment concerns outside application code.
name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Create preview artifact
        run: |
          mkdir -p preview
          cp -r .next preview/next-build
          cp package.json preview/
          cp next.config.ts preview/ 2>/dev/null || true
          tar -czf geodesy-preview.tar.gz preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: malaya-geodesia-preview
          path: geodesy-preview.tar.gz
          retention-days: 7

      - name: Preview summary
        run: |
          {
            echo "## Preview build"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Build: npm run build"
            echo "- Artifact: malaya-geodesia-preview"
          } >> "$GITHUB_STEP_SUMMARY"
