name: Live Preview

on:
  # Public dev tunnel is intentionally manual; never expose it automatically on push.
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: live-preview-main
  cancel-in-progress: true

jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Start Next.js dev server
        shell: bash
        run: |
          nohup npm run dev -- --hostname 0.0.0.0 > /tmp/geodesia-next.log 2>&1 &
          echo $! > /tmp/geodesia-next.pid

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Next.js dev server is ready on :3000"
              exit 0
            fi
            sleep 2
          done

          echo "Next.js dev server did not start"
          cat /tmp/geodesia-next.log
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public live tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > /tmp/geodesia-tunnel.log 2>&1 &
          echo $! > /tmp/geodesia-tunnel.pid

          URL=""
          for i in {1..90}; do
            URL="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/geodesia-tunnel.log | tail -1 || true)"
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Cloudflare Quick Tunnel did not return a URL"
            cat /tmp/geodesia-tunnel.log
            exit 1
          fi

          echo "LIVE_PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL" > /tmp/geodesia-preview-url

          {
            echo "## Live Preview"
            echo
            echo "**$URL**"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Temporary public development preview. Anyone with the URL may access it; do not enter secrets or real customer data."
          } >> "$GITHUB_STEP_SUMMARY"

          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="Live Preview" \
            -f description="Temporary live preview is running" \
            -f target_url="$URL"

      - name: Verify public preview
        shell: bash
        run: |
          echo "Preview URL: $LIVE_PREVIEW_URL"
          for i in {1..20}; do
            if curl -fsSL --max-time 20 "$LIVE_PREVIEW_URL/" >/dev/null; then
              echo "Public preview responds successfully"
              exit 0
            fi
            sleep 3
          done

          echo "Public preview is not responding"
          cat /tmp/geodesia-tunnel.log || true
          exit 1

      - name: Keep preview alive
        shell: bash
        run: |
          TUNNEL_PID="$(cat /tmp/geodesia-tunnel.pid)"
          for i in {1..100}; do
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "cloudflared process exited"
              cat /tmp/geodesia-tunnel.log || true
              exit 1
            fi

            if ! curl -fsSL --max-time 10 "$LIVE_PREVIEW_URL/" >/dev/null; then
              echo "Live preview endpoint stopped responding"
              cat /tmp/geodesia-tunnel.log || true
              exit 1
            fi

            sleep 30
          done

          echo "Live preview reached the workflow timeout window."

      - name: Failure diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${LIVE_PREVIEW_URL:-}" ]; then
            gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context="Live Preview" \
              -f description="Live preview stopped" \
              -f target_url="$LIVE_PREVIEW_URL" || true
          fi
          echo "### Next.js log"
          cat /tmp/geodesia-next.log || true
          echo
          echo "### Cloudflare Tunnel log"
          cat /tmp/geodesia-tunnel.log || true
